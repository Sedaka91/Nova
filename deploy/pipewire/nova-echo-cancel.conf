# Echo cancellation for Nova (WebRTC AEC), loaded by PipeWire as a drop-in.
# Creates the virtual source "nova_mic" and the virtual sink "nova_sink".
# Link: ~/.config/pipewire/pipewire.conf.d/nova-echo-cancel.conf (see README.md).
#
# Default devices: the system defaults must stay untouched. WirePlumber picks the
# default node with the highest priority.session, and real ALSA devices sit in
# the thousands, so priority.session = 1 on the virtual source and sink keeps
# them from ever becoming default. Nova's helpers select them by name only.
# The capture/playback streams are plain streams pinned to the hardware via
# target.object, so they never follow the default device either.

context.modules = [
    {
        name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            # monitor.mode stays off: nova_sink is a real sink that Nova writes to.

            # Microphone feeding the canceller (JLAB TALK PRO).
            capture.props = {
                node.name = "nova_echo_capture"
                node.passive = true
                target.object = "alsa_input.usb-C-Media_Electronics_Inc._JLAB_TALK_PRO_MICROPHONE-00.analog-stereo"
            }
            # Echo-free source that wakeword and stt record from.
            source.props = {
                node.name = "nova_mic"
                node.description = "Nova Mikrofon (Echo-Unterdrückung)"
                media.class = Audio/Source
                priority.session = 1
                priority.driver = 1
            }
            # Sink that tts plays to; also the reference signal for the canceller.
            sink.props = {
                node.name = "nova_sink"
                node.description = "Nova Lautsprecher (Echo-Unterdrückung)"
                media.class = Audio/Sink
                priority.session = 1
                priority.driver = 1
            }
            # Forwards nova_sink to the built-in speakers.
            playback.props = {
                node.name = "nova_echo_playback"
                node.passive = true
                target.object = "alsa_output.pci-0000_00_1f.3.analog-stereo"
            }
        }
    }
]
